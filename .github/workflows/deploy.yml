name: Deploy to Amazon EC2

on:
  push:
    branches:
      - main # Change this to your deployment branch if different

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Update based on your node version

      - name: Install dependencies
        run: npm ci

      # Add any testing or build steps here if needed
      # - name: Run tests
      #   run: npm test

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Update this path to where your application lives on the EC2 instance
             cd /home/ubuntu/mcqvitals-backend
            
            # Pull the latest changes from the repository
            git pull origin main
            
            # Install production dependencies
            npm install
            
            # Restart the application using PM2
            pm2 restart mcqvitals-backend || pm2 start index.js --name "mcqvitals-backend"
